name: Build and publish Docker image

on:
  push:
    branches: ["main", "beta"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  ghcr:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata for GHCR
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/123pan-strm-docker
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/123pan-strm-docker:sha-${{ github.sha }}
            ${{ github.ref == 'refs/heads/beta' && format('ghcr.io/{0}/123pan-strm-docker:beta', github.repository_owner) || '' }}
            ${{ github.ref == 'refs/heads/main' && format('ghcr.io/{0}/123pan-strm-docker:latest', github.repository_owner) || '' }}
          labels: ${{ steps.meta.outputs.labels }}

  dockerhub:
    name: Build and push to Docker Hub
    runs-on: ubuntu-latest
    # 需要在仓库 Settings -> Secrets and variables -> Actions 中设置：
    # DOCKERHUB_USERNAME 和 DOCKERHUB_TOKEN
    if: ${{ vars.ENABLE_DOCKERHUB == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata for Docker Hub
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/123pan-strm-docker
          tags: |
            type=sha,prefix=sha-
            type=ref,event=tag

      - name: Build and push to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
