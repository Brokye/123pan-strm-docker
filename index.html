<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>123 秒传 STRM</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#f5f5f7;color:#1d1d1f;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1300px;margin:0 auto;padding:24px}
h1{font-size:28px;font-weight:800}.sub{color:#86868b;font-size:14px;margin:6px 0 20px}

.modebar{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:16px 20px;margin-bottom:20px;transition:all .4s}
.modebar.fast{background:#fff5f5;border-color:#ff3b30;box-shadow:0 0 16px rgba(255,59,48,.1)}
.modebar .mode-icon{font-size:28px;flex-shrink:0}
.modebar .mode-text{flex:1}
.modebar .mode-title{font-size:16px;font-weight:700;color:#1d1d1f}
.modebar.fast .mode-title{color:#ff3b30}
.modebar .mode-desc{font-size:13px;color:#86868b;margin-top:4px}
.modebar.fast .mode-desc{color:#ff3b30}
.modebar .mode-badge{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700;background:#e8e8ed;color:#1d1d1f}
.modebar.fast .mode-badge{background:#ff3b30;color:#fff;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.toggle{display:flex;align-items:center;gap:8px;cursor:pointer;flex-shrink:0}
.toggle input{display:none}
.toggle .track{width:44px;height:24px;background:#d2d2d7;border-radius:99px;position:relative;transition:background .3s}
.toggle input:checked+.track{background:#ff3b30}
.toggle .track::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;background:#fff;border-radius:50%;transition:transform .3s;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.toggle input:checked+.track::after{transform:translateX(20px)}

.grid{display:grid;grid-template-columns:460px 1fr;gap:20px}
.card{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:20px 22px;margin-bottom:14px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
h2{font-size:19px;font-weight:700;margin-bottom:12px}
label{display:block;margin:12px 0 6px;color:#6e6e73;font-size:14px;font-weight:600}
input,textarea,select{width:100%;background:#fff;color:#1d1d1f;border:1.5px solid #d2d2d7;border-radius:10px;padding:11px 14px;font-size:15px;font-family:inherit;outline:none;transition:border .2s}
input:focus,textarea:focus,select:focus{border-color:#0071e3}
textarea{height:180px;font-family:Consolas,monospace;font-size:14px;resize:vertical}
.btn{border:0;border-radius:10px;padding:11px 16px;font-weight:700;cursor:pointer;margin-top:12px;font-size:14px;font-family:inherit;transition:all .2s}
.btn:hover{opacity:.85}
.btn-p{background:#0071e3;color:#fff}.btn-g{background:#34c759;color:#fff}.btn-o{background:#e8e8ed;color:#1d1d1f}.btn-r{background:#ff3b30;color:#fff}.btn-w{background:#f59e0b;color:#fff}
.btn-sm{padding:6px 12px;font-size:13px}
.row{display:flex;gap:10px;margin-top:10px}.row .btn{flex:1}

.lib-list{display:grid;gap:10px}
.lib-item{background:#fff;border:1px solid rgba(0,0,0,.08);border-radius:14px;padding:14px 18px}
.lib-name{font-size:16px;font-weight:700}
.lib-meta{color:#86868b;font-size:13px;margin:4px 0 8px}
.lib-actions{display:flex;gap:8px;flex-wrap:wrap}
.lib-tree{display:none;margin-top:10px;padding-top:10px;border-top:1px solid #e8e8ed;max-height:400px;overflow-y:auto}
.lib-tree.open{display:block}
.pill{display:inline-block;padding:3px 10px;border-radius:99px;font-size:13px;font-weight:600;margin-right:6px;color:#fff}
.cat-head{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#f9f9fb;border:1px solid #e8e8ed;border-radius:10px;margin-top:10px;cursor:pointer;user-select:none}
.cat-head:hover{background:#f0f0f5}
.cat-arrow{font-size:12px;transition:transform .2s;color:#86868b}
.cat-arrow.open{transform:rotate(90deg)}
.cat-body{display:none}.cat-body.open{display:block}
.cat-count{color:#86868b;font-size:12px;margin-left:auto}
.file-row{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;cursor:default}.file-row:hover{background:#f5f5f7}
.fname{flex:1;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsize{font-size:12px;color:#86868b;flex-shrink:0}
.folder-head{display:flex;align-items:center;gap:8px;padding:5px 10px;border-radius:6px;cursor:pointer}.folder-head:hover{background:#f5f5f7}
.folder-arrow{font-size:10px;color:#86868b;width:14px;text-align:center;transition:transform .18s}.folder-arrow.open{transform:rotate(90deg)}
.folder-body{display:none}.folder-body.open{display:block}
.log{white-space:pre-wrap;background:#f9f9fb;border:1px solid #e8e8ed;border-radius:12px;padding:14px 18px;height:260px;overflow:auto;font-family:Consolas,monospace;font-size:13px;line-height:1.6;color:#6e6e73}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:200;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:#fff;border-radius:16px;padding:24px;width:440px;max-width:90vw;box-shadow:0 20px 60px rgba(0,0,0,.15)}
.modal input,.modal select{font-size:16px;padding:12px 16px;margin-bottom:8px}
.modal h3{font-size:18px;margin-bottom:12px}
.input-hidden{display:none}
</style></head><body>
<div class="wrap">
<h1>123 秒传 → STRM</h1>
<div class="sub">NAS Docker 一体版 · 持久化保存秒传库 · 直接生成 STRM · 播放时自动秒传并 302 到真实直链</div>

<div class="modebar" id="modebar">
  <span class="mode-icon" id="modeIcon">🛡️</span>
  <div class="mode-text">
    <div class="mode-title" id="modeTitle">缓存模式</div>
    <div class="mode-desc" id="modeDesc">文件保存 24 小时后自动清理，适合反复播放</div>
  </div>
  <span class="mode-badge" id="modeBadge">安全</span>
  <label class="toggle"><input id="fastMode" type="checkbox"><span class="track"></span></label>
</div>

<div class="grid">
  <div>
    <div class="card"><h2>1. 保存秒传 JSON</h2>
      <label>库名称</label><input id="libName" placeholder="例如：全职猎人 2011">
      <label>分类</label><select id="libCat"><option value="">未分类</option><option value="电影">电影</option><option value="剧集">剧集</option><option value="动漫">动漫</option><option value="纪录片">纪录片</option><option value="综艺">综艺</option></select>
      <label>JSON 内容（可拖拽 .json 文件到文本框）</label>
      <textarea id="content" placeholder='粘贴 {"files":[{"etag":"...","size":"...","path":"xxx.mkv"}]}'></textarea>
      <div class="row">
        <button class="btn btn-o" onclick="document.getElementById('fileInput').click()">选择 JSON 文件</button>
        <button class="btn btn-p" onclick="saveLib()">保存到库</button>
      </div>
      <input type="file" id="fileInput" accept=".json,application/json" class="input-hidden">
    </div>
    <div class="card"><h2>2. 基础设置</h2>
      <label>123 账号</label><input id="panUser">
      <label>123 密码</label><input id="panPass" type="password">
      <label>STRM 输出目录</label><input id="outDir">
      <label>服务地址</label><input id="srvBase">
      <button class="btn btn-g" onclick="saveCfg()" style="width:100%">保存基础设置</button>
    </div>
  </div>

  <div>
    <div class="card"><h2>已保存的秒传库</h2>
      <div class="row"><button class="btn btn-o btn-sm" onclick="exportBackup()">导出备份</button><button class="btn btn-w btn-sm" onclick="document.getElementById('restoreInput').click()">导入恢复</button></div>
      <input type="file" id="restoreInput" accept=".json" class="input-hidden">
      <div id="libList" class="lib-list"></div>
    </div>
    <div class="card"><h2>日志</h2><div id="log" class="log"></div></div>
  </div>
</div>
</div>

<div class="modal-overlay" id="renameDlg">
  <div class="modal"><h3>重命名秒传库</h3>
    <input id="renameInput">
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
      <button class="btn btn-o btn-sm" onclick="closeRename()">取消</button>
      <button class="btn btn-p btn-sm" onclick="doRename()">确定</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="mergeDlg">
  <div class="modal"><h3>合并 / 改分类</h3>
    <p style="font-size:14px;color:#6e6e73;margin-bottom:12px">此操作保留文件索引不变，已生成的 STRM 可继续使用</p>
    <label>目标分类</label><select id="mergeCat"><option value="">未分类</option><option value="电影">电影</option><option value="剧集">剧集</option><option value="动漫">动漫</option><option value="纪录片">纪录片</option><option value="综艺">综艺</option></select>
    <div style="display:flex;gap:8px;margin-top:12px;justify-content:flex-end">
      <button class="btn btn-o btn-sm" onclick="closeMerge()">取消</button>
      <button class="btn btn-p btn-sm" onclick="doMerge()">确认</button>
    </div>
  </div>
</div>

<script>
var API=window.location.origin,libCache={},renameLibId=null,mergeLibId=null;
function log(s){var el=document.getElementById('log');el.textContent+=s+'\n';el.scrollTop=el.scrollHeight}
async function api(u,opt){var r=await fetch(API+u,opt);var j=await r.json();if(!r.ok||j.ok===false)throw new Error(j.error||j.detail||r.status);return j}
function fmtSize(s){s=parseInt(s)||0;if(s<1024)return s+' B';if(s<1048576)return(s/1024).toFixed(1)+' KB';if(s<1073741824)return(s/1048576).toFixed(1)+' MB';return(s/1073741824).toFixed(2)+' GB';}
var catColors={电影:'#a855f7',剧集:'#3b82f6',动漫:'#ec4899',纪录片:'#22c55e',综艺:'#f59e0b','':'#6b7280'};
var catOrder=['电影','剧集','动漫','纪录片','综艺',''];
var catNames={电影:'电影',剧集:'剧集',动漫:'动漫',纪录片:'纪录片',综艺:'综艺','':'未分类'};
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ====== MODE ======
function applyModeUI(f){var bar=document.getElementById('modebar'),icon=document.getElementById('modeIcon'),title=document.getElementById('modeTitle'),desc=document.getElementById('modeDesc'),badge=document.getElementById('modeBadge');document.getElementById('fastMode').checked=f;if(f){bar.classList.add('fast');icon.textContent='⚠️';title.textContent='入库模式';desc.textContent='获取直链后 1 分钟即删除，播放完即清理';badge.textContent='即时清理';badge.style.background='#ff3b30';badge.style.color='#fff'}else{bar.classList.remove('fast');icon.textContent='🛡️';title.textContent='缓存模式';desc.textContent='文件保存 24 小时后自动清理，适合反复播放';badge.textContent='安全';badge.style.background='#e8e8ed';badge.style.color='#1d1d1f'}}
async function loadMode(){var j=await api('/api/mode');applyModeUI(j.mode==='fast');}
document.getElementById('fastMode').addEventListener('change',function(){var f=this.checked;applyModeUI(f);api('/api/mode',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({mode:f?'fast':'cache'})}).then(function(j){log('已切换：'+j.label);});});

// ====== CONFIG ======
async function loadCfg(){var c=await api('/api/config');document.getElementById('outDir').value=c.output_dir||'';document.getElementById('srvBase').value=c.server_base||'';document.getElementById('panUser').value=c.pan_username||'';document.getElementById('panPass').value=c.pan_password||'';}
async function saveCfg(){var o=document.getElementById('outDir').value,s=document.getElementById('srvBase').value,u=document.getElementById('panUser').value,p=document.getElementById('panPass').value;await api('/api/config',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({output_dir:o,server_base:s,pan_username:u,pan_password:p})});log('√ 设置已保存');}

// ====== SAVE LIB ======
async function saveLib(){try{var raw=JSON.parse(document.getElementById('content').value);var name=document.getElementById('libName').value,cat=document.getElementById('libCat').value;var j=await api('/api/libraries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name,content:raw,category:cat})});log('√ 保存成功：'+j.id+'（'+j.files+' 个文件）');document.getElementById('content').value='';document.getElementById('libName').value='';loadLibs();}catch(e){alert(e.message);}}
document.getElementById('fileInput').onchange=async function(){var f=this.files[0];if(!f)return;var n=document.getElementById('libName');n.value=n.value||f.name.replace(/\.json$/,'');document.getElementById('content').value=await f.text();};
document.getElementById('content').addEventListener('dragover',function(e){e.preventDefault();});
document.getElementById('content').addEventListener('drop',async function(e){e.preventDefault();var f=e.dataTransfer.files[0];if(!f)return;var n=document.getElementById('libName');n.value=n.value||f.name.replace(/\.json$/,'');this.value=await f.text();});

// ====== LIBS ======
function _itemHtml(x){var cat=x.category||'';var tag=cat?'<span class="pill" style="background:'+(catColors[cat]||'#6b7280')+'">'+esc(cat)+'</span> ':'';return'<div class="lib-item"><div class="lib-name">'+tag+esc(x.name)+'</div><div class="lib-meta">视频 '+x.video+' · 总 '+x.total+' · id: '+esc(x.id)+'</div><div class="lib-actions"><button class="btn btn-p btn-sm" onclick="genSTRM(\''+esc(x.id)+'\')">生成 STRM</button><button class="btn btn-o btn-sm" onclick="toggleLib(\''+esc(x.id)+'\',this)">展开文件</button><button class="btn btn-o btn-sm" onclick="askRename(\''+esc(x.id)+'\',\''+esc(x.name)+'\')">重命名</button><button class="btn btn-o btn-sm" onclick="askMerge(\''+esc(x.id)+'\',\''+esc(cat)+'\')">改分类</button><button class="btn btn-r btn-sm" onclick="delLib(\''+esc(x.id)+'\')">删除</button></div><div class="lib-tree" id="tree_'+esc(x.id)+'"></div></div>';}

async function loadLibs(){var j=await api('/api/libraries');var items=j.items||[];var el=document.getElementById('libList');if(!items.length){el.innerHTML='<div style="color:#86868b;font-size:14px;padding:8px">暂无秒传库</div>';return;}
var groups={};catOrder.forEach(function(c){groups[c]=[];});
items.forEach(function(x){var cat=x.category||'';if(!groups[cat])groups[cat]=[];groups[cat].push(x);});
var h='';catOrder.forEach(function(cat){var g=groups[cat];if(!g||g.length===0)return;
  h+='<div class="cat-head" onclick="var a=this.querySelector(\'.cat-arrow\');var b=this.nextElementSibling;a.classList.toggle(\'open\');b.classList.toggle(\'open\')"><span class="cat-arrow open">▶</span><span class="pill" style="background:'+(catColors[cat]||'#6b7280')+'">'+(catNames[cat]||cat||'未分类')+'</span><span class="cat-count">('+g.length+')</span>'+(g.length>1?'<button class="btn btn-w btn-sm" style="margin-left:8px" onclick="event.stopPropagation();mergeCat(\''+esc(cat)+'\')">合并此分类</button>':'')+'</div><div class="cat-body open">'+g.map(_itemHtml).join('')+'</div>';
});el.innerHTML=h||'<div style="color:#86868b;font-size:14px;padding:8px">暂无秒传库</div>';}

// ====== TREE ======
function buildFolders(files){var folders={};var keys=Object.keys(files);for(var i=0;i<keys.length;i++){var parts=keys[i].replace(/\\/g,'/').split('/');var dir=parts.slice(0,-1).join('/');if(!folders[dir])folders[dir]={children:[]};folders[dir].children.push(keys[i]);for(var j=parts.length-2;j>=1;j--){var pd=parts.slice(0,j).join('/');if(!folders[pd])folders[pd]={children:[]};}}return folders;}
function countDesc(folders,dir){var t=0,c=folders[dir];if(c)t=c.children.length;for(var d in folders){if(d===dir||d==='')continue;if(d.indexOf(dir+'/')===0)t+=countDesc(folders,d);}return t;}
function filesUnder(folders,dir){var a=[],c=folders[dir];if(c)a=a.concat(c.children);for(var d in folders){if(d===dir||d==='')continue;if(d.indexOf(dir+'/')===0)a=a.concat(filesUnder(folders,d));}return a;}

function renderTree(folders,files,libId){var dirs=Object.keys(folders).sort(function(a,b){var da=(a.match(/\//g)||[]).length,db=(b.match(/\//g)||[]).length;return da!==db?da-db:a.localeCompare(b);});var h='',top=[];for(var i=0;i<dirs.length;i++){if(dirs[i]==='')continue;var ls=dirs[i].lastIndexOf('/'),pd=ls>=0?dirs[i].substring(0,ls):null;if(!pd||!folders[pd])top.push(dirs[i]);}for(var t=0;t<top.length;t++)h+=renderDir(top[t],0,folders,files,libId);return h||'<div style="font-size:12px;color:#86868b">无文件</div>';}
function renderDir(dir,depth,folders,files,libId){var ch=folders[dir]?folders[dir].children||[]:[];var name=dir.split('/').pop()||dir,pl=dir.split('/').length;var dfs=[];for(var i=0;i<ch.length;i++){if(ch[i].replace(/\\/g,'/').split('/').length===pl+1)dfs.push(ch[i]);}var sds=[];for(var d in folders){if(d===dir||d==='')continue;if(d.split('/').length===pl+1&&d.indexOf(dir+'/')===0)sds.push(d);}dfs.sort();sds.sort();var pad=depth*16;var cnt=countDesc(folders,dir);var h='<div><div class="folder-head" style="padding-left:'+pad+'px" onclick="var a=this.querySelector(\'.folder-arrow\');var b=this.parentElement.querySelector(\'.folder-body\');a.classList.toggle(\'open\');b.classList.toggle(\'open\')"><span class="folder-arrow">▶</span><span>📁</span><span style="font-size:13px;font-weight:600">'+esc(name)+'</span><span style="font-size:11px;color:#86868b;margin-left:auto">'+cnt+'</span><span style="cursor:pointer;color:#ff3b30;font-size:11px;padding:0 3px;margin-left:4px" title="删除文件夹" onclick="event.stopPropagation();removeFolder(\''+esc(libId)+'\',\''+esc(dir)+'\',this)">✕</span></div><div class="folder-body">';for(var f=0;f<dfs.length;f++)h+=renderFile(dfs[f],depth+1,files,libId);for(var s=0;s<sds.length;s++)h+=renderDir(sds[s],depth+1,folders,files,libId);h+='</div></div>';return h;}
function renderFile(fp,depth,files,libId){var info=files[fp];if(!info)return'';var pad=depth*16;return'<div class="file-row" style="padding-left:'+pad+'px"><span style="font-size:13px">🎬</span><span class="fname" title="'+esc(info.name)+'">'+esc(info.name)+'</span><span class="fsize">'+fmtSize(info.size)+'</span><span style="cursor:pointer;color:#ff3b30;font-size:11px;padding:0 3px" title="删除" onclick="removeFile(\''+esc(libId)+'\',\''+esc(fp)+'\',this)">✕</span></div>';}

async function toggleLib(id,btn){var tree=document.getElementById('tree_'+id);if(tree.classList.contains('open')){tree.classList.remove('open');btn.textContent='展开文件';return;}if(!libCache[id]){var lib=await api('/api/libraries/'+id);var fs={};for(var i=0;i<lib.files.length;i++){var f=lib.files[i];fs[f.path]={etag:f.etag||'',size:parseInt(f.size)||0,name:f.path.split('/').pop()};}libCache[id]={files:fs,folders:buildFolders(fs)};}tree.innerHTML=renderTree(libCache[id].folders,libCache[id].files,id);tree.classList.add('open');btn.textContent='收起文件';}

async function removeFile(libId,fp,el){if(!confirm('删除此文件？\n'+fp))return;try{delete libCache[libId];var lib=await api('/api/libraries/'+libId);var updated=[];for(var i=0;i<lib.files.length;i++){if(lib.files[i].path===fp)continue;updated.push({idx:updated.length,path:lib.files[i].path.replace(/\\/g,'/'),etag:lib.files[i].etag,size:lib.files[i].size});}await api('/api/libraries/'+libId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:updated})});log('已删除：'+fp);var tree=document.getElementById('tree_'+libId);tree.classList.remove('open');var b=tree.parentElement.querySelector('.btn-o.btn-sm');if(b&&b.textContent==='收起文件')b.textContent='展开文件';loadLibs();}catch(e){alert(e.message);}}

async function removeFolder(libId,dir,el){var all=filesUnder(libCache[libId].folders,dir);if(!all.length)return;if(!confirm('删除 '+all.length+' 个文件？\n'+dir))return;try{delete libCache[libId];var lib=await api('/api/libraries/'+libId);var keep=[];for(var i=0;i<lib.files.length;i++){if(all.indexOf(lib.files[i].path)===-1)keep.push({idx:keep.length,path:lib.files[i].path.replace(/\\/g,'/'),etag:lib.files[i].etag,size:lib.files[i].size});}await api('/api/libraries/'+libId,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({files:keep})});log('已删除文件夹：'+dir+' ('+all.length+' 个)');var tree=document.getElementById('tree_'+libId);tree.classList.remove('open');var b=tree.parentElement.querySelector('.btn-o.btn-sm');if(b&&b.textContent==='收起文件')b.textContent='展开文件';loadLibs();}catch(e){alert(e.message);}}

async function mergeCat(cat){var items=(await api('/api/libraries')).items||[];var ids=[];for(var i=0;i<items.length;i++){if((items[i].category||'')===cat)ids.push(items[i].id);}if(ids.length<2){alert('此分类只有一个库，无需合并');return;}if(!confirm('合并「'+cat+'」下的 '+ids.length+' 个库为 1 个？\n原库将被删除，已生成 STRM 不受影响'))return;try{var allFiles=[],names=[];for(var j=0;j<ids.length;j++){var lib=await api('/api/libraries/'+ids[j]);names.push(lib.name);for(var k=0;k<lib.files.length;k++){var f=lib.files[k];allFiles.push({etag:f.etag,size:String(f.size),path:f.path.replace(/\\/g,'/')});}}var mergedName=names.join(' + ').substring(0,80);for(var d=0;d<ids.length;d++){await api('/api/libraries/'+encodeURIComponent(ids[d]),{method:'DELETE'});}var newLib=await api('/api/libraries',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:mergedName,content:{files:allFiles},category:cat})});log('合并完成：'+ids.length+' 个库 → '+newLib.id+'（'+allFiles.length+' 个文件）');loadLibs();}catch(e){alert(e.message);}}

async function genSTRM(id){try{var o=document.getElementById('outDir').value,s=document.getElementById('srvBase').value;var j=await api('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({lib_id:id,output_dir:o,server_base:s,include_subtitles:true})});log('√ 完成：'+j.count+' STRM'+(j.subtitles?', '+j.subtitles+' 字幕':'')+'\n输出：'+j.output_dir+'\n'+j.examples.slice(0,5).join('\n'));}catch(e){alert(e.message);}}
async function delLib(id){if(!confirm('删除秒传库 '+id+' ？'))return;await api('/api/libraries/'+encodeURIComponent(id),{method:'DELETE'});loadLibs();}

// ====== RENAME ======
function askRename(id,name){renameLibId=id;document.getElementById('renameInput').value=name;document.getElementById('renameDlg').classList.add('show');}
function closeRename(){document.getElementById('renameDlg').classList.remove('show');renameLibId=null;}
async function doRename(){var name=document.getElementById('renameInput').value.trim();if(!name||!renameLibId){closeRename();return;}await api('/api/libraries/'+encodeURIComponent(renameLibId),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name})});closeRename();loadLibs();log('已重命名：'+name);}

// ====== MERGE / CHANGE CATEGORY ======
function askMerge(id,cat){mergeLibId=id;document.getElementById('mergeCat').value=cat||'';document.getElementById('mergeDlg').classList.add('show');}
function closeMerge(){document.getElementById('mergeDlg').classList.remove('show');mergeLibId=null;}
async function doMerge(){var cat=document.getElementById('mergeCat').value;if(!mergeLibId){closeMerge();return;}// 只改分类，保留 files 索引不变，已生成的 STRM 不受影响
await api('/api/libraries/'+encodeURIComponent(mergeLibId),{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({category:cat})});closeMerge();loadLibs();log('已改分类为：'+(cat||'未分类')+'（文件索引保持不变）');}

// ====== BACKUP ======
async function exportBackup(){var r=await fetch(API+'/api/backup');var blob=await r.blob();var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='123pan-strm-backup-'+Date.now()+'.json';a.click();log('√ 备份已下载');}
document.getElementById('restoreInput').onchange=async function(){var f=this.files[0];if(!f)return;var fd=new FormData();fd.append('file',f);var r=await fetch(API+'/api/restore/upload',{method:'POST',body:fd});var j=await r.json();if(!j.ok){alert(j.error);return;}log('恢复完成：成功 '+j.restored+' 个，跳过 '+j.skipped+' 个');loadLibs();};

loadMode();loadCfg();loadLibs();
